<!DOCTYPE html>
<html>
<head>
<title>Registrar paso de producto</title>
<style>
body{background:#6c4ed6;font-family:Arial;color:white;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:900px;width:100%;}
.card{background:rgba(0,0,0,.2);padding:30px;border-radius:12px;}
label{display:block;margin-top:10px;margin-bottom:6px;font-weight:600;}
input{width:100%;padding:10px;border-radius:6px;border:none;}
button{margin-top:16px;padding:12px 20px;font-size:16px;background:#2f7bff;color:white;border:none;border-radius:6px;cursor:pointer;width:100%;}
#resultado,#resultadoModelo{margin-top:16px;min-height:32px;}
</style>
</head>
<body>
<div class="layout">
<div class="card">
<h2>Crear modelo ideal</h2>
<label>Tipo</label>
<input id="tipoIdeal" placeholder="botella-600ml" />
<label>QR ideal</label>
<input id="qrIdeal" placeholder="QR-IDEAL-001" />
<label>Peso esperado</label>
<input id="pesoIdeal" type="number" placeholder="150" />
<label>Color esperado</label>
<input id="colorIdeal" placeholder="rojo" />
<label>Altura esperada</label>
<input id="alturaIdeal" type="number" placeholder="80" />
<button id="btnCrearModelo">Guardar modelo ideal</button>
<p id="resultadoModelo"></p>
</div>

<div class="card">
<h2>Registro de producto real en banda</h2>
<label>QR medido del producto (libre)</label>
<input id="qr" placeholder="QR-LIBRE-001" />
<label>Modelo ideal (tipo o QR) - opcional</label>
<input id="modeloReferencia" placeholder="ej. botella-600ml" />
<label>Peso detectado</label>
<input id="peso" type="number" placeholder="150" />
<label>Color detectado</label>
<input id="color" placeholder="rojo" />
<label>Altura detectada</label>
<input id="altura" type="number" placeholder="80" />
<label>Canal de banda</label>
<input id="canal" placeholder="1" value="1" />
<button id="btnRegistrar">Registrar paso</button>
<p id="resultado"></p>
</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="js/nuevo-ticket.js"></script>
</body>
</html>
