<!DOCTYPE html>
<html>
<head>
<title>Pantalla de inspección</title>
<style>
body{display:flex;font-family:Arial;background:#111;color:white;min-height:100vh;}
.main{flex:3;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;}
.main h1{font-size:42px;margin:0;}
.main p{font-size:24px;}
.side{flex:1;background:#6c4ed6;padding:20px;}
.item{margin-bottom:18px;padding:10px;border-radius:8px;background:rgba(255,255,255,.1);}
.badge{padding:4px 8px;border-radius:999px;font-size:12px;}
.ok{background:#0f9d58;}
.fail{background:#c62828;}
</style>
</head>
<body>
<div class="main">
<h1 id="productoPrincipal">Sin revisiones</h1>
<p id="monitorPrincipal"></p>
<p id="estadoPrincipal"></p>
</div>
<div class="side" id="listaRevisiones"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="js/publico.js"></script>
</body>
</html>
