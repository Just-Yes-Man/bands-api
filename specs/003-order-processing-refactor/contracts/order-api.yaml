openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
  description: Contracts for order-oriented processing.
servers:
  - url: http://localhost:1200

paths:
  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Create order with multiple lines
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
    get:
      tags: [Orders]
      summary: List orders by client
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: clienteId
          required: true
          schema:
            type: integer
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Orders list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          description: Unauthorized

  /api/v1/orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get order detail and progress
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders/{orderId}/lines/{lineId}/progress:
    post:
      tags: [Orders]
      summary: Increment line progress counters
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
        - in: path
          name: lineId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineProgressUpdateRequest'
      responses:
        '200':
          description: Progress updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '409':
          description: Concurrency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders/{orderId}/lines/{lineId}/cancel:
    post:
      tags: [Orders]
      summary: Cancel a single order line
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
        - in: path
          name: lineId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Line canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateOrderRequest:
      type: object
      required: [clienteId, lineas]
      properties:
        clienteId:
          type: integer
        lineas:
          type: array
          minItems: 1
          items:
            type: object
            required: [modeloProductoId, cantidad]
            properties:
              modeloProductoId:
                type: integer
              cantidad:
                type: integer
                minimum: 1

    LineProgressUpdateRequest:
      type: object
      required: [deltaProcesadas, deltaRechazadas, version]
      properties:
        deltaProcesadas:
          type: integer
          minimum: 0
        deltaRechazadas:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0

    OrderLine:
      type: object
      required: [id, modeloProductoId, cantidad, procesadas, rechazadas, estadoLinea]
      properties:
        id:
          type: integer
        modeloProductoId:
          type: integer
        cantidad:
          type: integer
        procesadas:
          type: integer
        rechazadas:
          type: integer
        estadoLinea:
          type: string
          enum: [ACTIVA, CANCELADA, CERRADA]

    OrderProgress:
      type: object
      required: [totalSolicitadas, totalProcesadas, totalRechazadas, totalCanceladas, totalRestantes, porcentajeAvance]
      properties:
        totalSolicitadas:
          type: integer
        totalProcesadas:
          type: integer
        totalRechazadas:
          type: integer
        totalCanceladas:
          type: integer
        totalRestantes:
          type: integer
        porcentajeAvance:
          type: number

    Order:
      type: object
      required: [id, clienteId, estado, createdAt, updatedAt]
      properties:
        id:
          type: integer
        clienteId:
          type: integer
        estado:
          type: string
          enum: [PENDIENTE, EN_PROCESO, COMPLETADO, CANCELADO]
        createdAt:
          type: string
        updatedAt:
          type: string

    OrderDetailResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: object
          required: [order, progress, lineas]
          properties:
            order:
              $ref: '#/components/schemas/Order'
            progress:
              $ref: '#/components/schemas/OrderProgress'
            lineas:
              type: array
              items:
                $ref: '#/components/schemas/OrderLine'

    OrderListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: object
          required: [items, page, pageSize, total]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Order'
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer

    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
