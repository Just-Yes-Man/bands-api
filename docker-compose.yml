version: '3.9'
services:
  app:
    build: .
    container_name: conveyor-app
    ports:
      - "1200:1200"
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: conveyor-postgres
    environment:
      POSTGRES_DB: conveyor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
