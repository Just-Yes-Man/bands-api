services:
  app:
    build: .
    container_name: conveyor-app
    ports:
      - "1200:1200"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@conveyor-postgres:5432/conveyor
      PGHOST: conveyor-postgres
      PGPORT: "5432"
      PGDATABASE: conveyor
      PGUSER: postgres
      PGPASSWORD: postgres
      PGSSL: "false"
      EMQX_ENABLED: "true"
      EMQX_URL: mqtt://host.docker.internal:1883
      EMQX_ORDERS_PROGRESS_TOPIC: pedidos/avances
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run migrate && npm start"

  postgres:
    image: postgres:16-alpine
    container_name: conveyor-postgres
    environment:
      POSTGRES_DB: conveyor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conveyor"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
